name: opd_connect
description: "OPD Connect - appointment booking and queue management for Sri Lankan government hospital OPDs (IT3060 HCI, Group WE_81)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  provider: ^6.1.2
  intl: any
  qr_flutter: ^4.1.0  # check-in QR code on the patient's token
  google_fonts: ^6.3.3  # 9.x uses the separate material_ui package; keep 6.x with flutter/material

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
